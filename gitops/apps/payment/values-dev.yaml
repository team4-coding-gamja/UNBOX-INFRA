# Payment Service - Dev Environment
appName: payment-service
replicaCount: 1
annotations:
  reloadTimestamp: "2026-02-25-00-12" # Prometheus 쿼리 수정 완료 - 에러율 감지 테스트
image:
  repository: 632941626317.dkr.ecr.ap-northeast-2.amazonaws.com/unbox-dev-payment-repo
  tag: dev-4426714b8be1132f1c0f2b3b28edd392d1a6ccb9
  pullPolicy: Always
# Ingress 활성화
ingress:
  enabled: false
linkerd:
  enabled: true # Linkerd Service Mesh 활성화
service:
  port: 80
  targetPort: 8085
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: "/payment/actuator/health"
containerPort: 8085
env:
  SERVER_PORT: "8085"
  SERVER_SERVLET_CONTEXT_PATH: "/payment"
  SPRING_JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: JWT_SECRET
  DB_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  TEST_CANARY_DEPLOYMENT: "v2-bluegreen-error-rollback" # 에러율 감지 롤백 테스트
  TEST_ERROR_RATE: "50" # 50% 에러 발생 (롤백 유도)
  SPRING_DATASOURCE_URL:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: RDS_ENDPOINT
  SPRING_DATASOURCE_USERNAME: "unbox_admin"
  SPRING_DATASOURCE_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: DB_PASSWORD
  SPRING_DATA_REDIS_HOST:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: REDIS_ENDPOINT
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL: "true"
  SPRING_DATA_REDIS_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: REDIS_PASSWORD
  SPRING_KAFKA_BOOTSTRAP_SERVERS:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: KAFKA_ENDPOINT
  # Tracing 활성화 (Tempo)
  MANAGEMENT_TRACING_ENABLED: "true"
  TEMPO_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
  # Toss Payments (SSM에서 가져옴)
  TOSS_SECRET_KEY:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: TOSS_SECRET_KEY
  TOSS_SECURITY_KEY:
    valueFrom:
      secretKeyRef:
        name: db-secret
        key: TOSS_SECURITY_KEY
resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
rollout:
  enabled: true
  strategy: "blueGreen"
  # Notification 설정 (Discord 알림)
  notifications:
    - trigger: rollout-paused
      send:
        - discord
    - trigger: rollout-completed
      send:
        - discord
    - trigger: rollout-aborted
      send:
        - discord
  healthCheck:
    enabled: true
    path: "/payment/actuator/health"
    periodSeconds: 10
    startupProbe:
      failureThreshold: 60
      periodSeconds: 10
  blueGreen:
    activeService: payment-service
    previewService: payment-service-preview
    autoPromotionEnabled: true # 테스트용 자동 승격
    autoPromotionSeconds: 180 # 3분 후 자동 승격 (분석 시간 확보)
    scaleDownDelaySeconds: 120 # 2분간 Blue 유지 (테스트용)
    prePromotionAnalysis:
      enabled: true # Green 환경에서 사전 검증
      templates:
        - templateName: payment-bluegreen-analysis
    postPromotionAnalysis:
      enabled: true # 승격 후에도 지속 모니터링
      templates:
        - templateName: payment-bluegreen-analysis
  # 분석 설정 - DB Expand-Contract 패턴 검증
  analysis:
    enabled: true
    interval: 10s
    successRate: 99.5 # 결제는 매우 엄격
    errorRate: 0.5
    avgResponseTime: 500
    failureLimit: 2
    queryRange: 1m
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
