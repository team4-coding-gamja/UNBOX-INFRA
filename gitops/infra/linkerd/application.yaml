# ⚠️ 주의: Linkerd는 2단계로 설치해야 합니다
# 1. linkerd-crds.yaml (CRD 먼저)
# 2. linkerd-control-plane.yaml (Control Plane 나중에)
#
# 이 파일은 Control Plane만 설치합니다.
# CRD는 linkerd-crds.yaml을 참고하세요.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkerd-control-plane
  namespace: argocd
  labels:
    type: infrastructure
    component: service-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # CRD 다음에 배포
spec:
  project: default
  source:
    repoURL: https://helm.linkerd.io/stable
    chart: linkerd-control-plane
    targetRevision: 1.16.11
    helm:
      releaseName: linkerd-control-plane
      values: |
        enableHA: false
        
        controllerReplicas: 1
        
        proxyInjector:
          replicaCount: 1
        spValidator:
          replicaCount: 1
        
        prometheus:
          enabled: true
        
        # 정책 설정 (기본 허용)
        policyValidator:
          enabled: false
        
  destination:
    server: https://kubernetes.default.svc
    namespace: linkerd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
