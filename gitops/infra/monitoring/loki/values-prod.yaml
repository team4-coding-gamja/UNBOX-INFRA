# gitops/infra/monitoring/loki/values-prod.yaml
# Loki - Production Environment Override with S3

loki:
  auth_enabled: false
  storage:
    type: 's3'
    bucketNames:
      chunks: unbox-prod-data-apne2
      admin: unbox-prod-data-apne2
      ruler: unbox-prod-data-apne2
    s3:
      endpoint: s3.ap-northeast-2.amazonaws.com
      region: ap-northeast-2
      insecure: false
      s3ForcePathStyle: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 2  # S3 사용 가능하므로 2개 이상 띄울 수 있음

# Prod: 캐시 활성화 (메모리 줄임)
chunksCache:
  enabled: true
  memcached:
    batch_size: 1024
    parallelism: 100
    allocatedMemory: 1024  # 1GB로 제한
    maxItemMemory: 5       # 5MB 객체 크기 제한

resultsCache:
  enabled: true
  memcached:
    batch_size: 1024
    parallelism: 100
    allocatedMemory: 512   # 512MB로 제한
    maxItemMemory: 5
