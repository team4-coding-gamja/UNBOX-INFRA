apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-bluegreen-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  payment-bluegreen-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
