              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 100,
              "min": 95,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 99
                  },
                  {
                    "color": "green",
                    "value": 99.5
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
