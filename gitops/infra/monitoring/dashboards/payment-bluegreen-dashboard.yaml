          "pluginVersion": "8.0.0",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"unbox-payment-service\", status!~\"5..\"}[1m])) / sum(rate(http_server_requests_seconds_count{job=\"unbox-payment-service\"}[1m])) * 100",
              "legendFormat": "Success Rate",
              "refId": "A"
            }
