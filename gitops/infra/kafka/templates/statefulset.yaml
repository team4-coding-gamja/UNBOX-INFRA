apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
          command:
            - "/bin/bash"
            - "-c"
            - |
              # Pod 이름에서 인덱스 추출 (0, 1, 2...)
              POD_INDEX=${HOSTNAME##*-}
              # Node ID 설정 (1, 2, 3...)
              export KAFKA_NODE_ID=$((POD_INDEX + 1))
              
              # Controller Quorum Voters 동적 구성
              VOTERS=""
              for i in $(seq 0 $(({{ .Values.replicaCount }} - 1))); do
                VOTER_ID=$((i + 1))
                VOTER_ADDR="${VOTER_ID}@kafka-${i}.kafka.{{ .Release.Namespace }}.svc.cluster.local:9093"
                if [ -z "$VOTERS" ]; then
                  VOTERS="$VOTER_ADDR"
                else
                  VOTERS="$VOTERS,$VOTER_ADDR"
                fi
              done
              export KAFKA_CONTROLLER_QUORUM_VOTERS="$VOTERS"
              
              # Advertised Listeners 설정
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://kafka-${POD_INDEX}.kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
              
              echo "Starting Kafka Node $KAFKA_NODE_ID with Voters: $KAFKA_CONTROLLER_QUORUM_VOTERS"
              
              /etc/kafka/docker/run
          env:
            # 기본 역할 설정
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            
            # 리스너 및 주소 설정
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            
            # 각 환경에 맞는 카프카 복제 수 설정
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "{{ .Values.replicaCount | default 1 }}"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "{{ .Values.replicaCount | default 1 }}"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "{{ if gt (int .Values.replicaCount) 1 }}2{{ else }}1{{ end }}"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "{{ .Values.replicaCount | default 1 }}"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}